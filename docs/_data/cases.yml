- id: noodles
  title: INFLUENCER LED PRODUCT LAUNCH
  client: Current Hot 'N' Spicy Noodles
  nav_category: Product Launch
  tags: Print · Social
  sections:
    - label: Background
      text: >-
        Yasodha Foods, an FMCG company, saw an opening in its noodle range to launch a Korean-inspired Hot 'N' Spicy variant — riding the wave of K-pop's cultural pull with Nepal's Gen Z.
    - label: Challenge
      text: >-
        A competitor had already released a Korean-ramen variant. Current's version needed to become the default choice and take real market share, not just join a crowded shelf.
    - label: Insight
      text: >-
        Both Gen Z and millennials followed a tight circle of social media food influencers to decide what to try next.
    - label: Strategy
      text: >-
        The campaign rode the viral Spicy Noodle Challenge — bringing on Nepal's best-known celebrity couple and leading food vloggers to take part in the "Current Noodle Challenge," backed by product sampling. The result was a wave of user-generated challenge content that gave the brand outsized visibility with Gen Z and millennial audiences online.
  result: Generated over 3M+ digital impressions
