- id: kantipur
  title: REBRAND & LAUNCH CAMPAIGN
  client: Kantipur Television HD
  nav_category: Rebrand & Launch
  tags: TV · Print · Radio · Digital
  sections:
    - label: Background
      text: >-
        Since 2003 Kantipur TV's programming and news broadcasts had been a household staple across Nepal. In 2017, Kantipur upgraded to an HD transmission, and sought to uplift its programming to reflect its position as a market leader in content and quality.
    - label: Challenge
      text: >-
        Reimagine Kantipur TV to give it an appeal to a newer generation of millennials without deviating from its already established brand imagery, and develop a market communication strategy to build buzz around the transition.
    - label: Insight
      text: >-
        Viewers turn to Kantipur's news and programming to gain perspective on what happens around the country.
    - label: Strategy
      text: >-
        Aligning the upgrade to HD transmission with viewers wanting to gain perspective, the rebrand and campaign focused on Kantipur TV HD bringing in a "Higher Perspective" on culture, news, and events around Nepal. As part of the upgrade, the logo was revised in line with that idea, portraying Kantipur's iconic temple from a bird's-eye view. The launch strategy encompassed a 360° integrated communications and awareness plan to tease and familiarize the market with both the new logo and the upgraded programming lineup. My role included developing the main communication approach, as well as overseeing and outlining the creative approach.
  media:
    - type: gallery
      class: battle-grid
      items:
        - image: assets/b217227a4575a87f39e5a91839ff5d54.jpg
          alt: Teaser for the upgraded Kantipur TV HD programming lineup
        - image: assets/566221e9fc62ba3573a57bc2a3719cb3.jpg
          alt: Teaser for the upgraded Kantipur TV HD programming lineup
    - type: gallery
      class: battle-grid single
      items:
        - image: assets/ad3670356672866d98ccf2296e2b76cc.jpg
          alt: "'Higher Perspective' final ad with an aerial mountain sunrise"
