- id: vianet
  title: REBRAND & TVC
  client: Vianet Communications
  nav_category: Rebrand & Relaunch
  tags: TV · Print · Radio · Digital
  sections:
    - label: Background
      text: >-
        Operational since 1999, Vianet, a leading internet service provider, had high brand recall but low adoption rates in households due to the perception of being a B2B service provider.
    - label: Challenge
      text: >-
        Creating a fortified brand image for Vianet with B2C services, while simultaneously showing that Vianet's network capacities were upgraded and state-of-the-art.
    - label: Insight
      text: >-
        As households were the primary target buyer group, family dynamics were researched. In this generation, family dynamics revolve around screens — Smart TVs, YouTube, laptops, phones, tablets. The older generation uses them to keep tabs on acquaintances and family abroad; children and teens for learning and entertainment; younger professionals for their livelihoods. The unifying element, in both a family and with technology? Connection.
    - label: Strategy
      text: >-
        With connection as the organising idea, the campaign reframed Vianet's existing tagline into one more inclusive and geared towards household adoption — "Aba Sabai Connected" ("Now Everyone's Connected"). Carrying this was a tweak to the logo and a more streamlined, clean visual rebrand. The campaign aligned each of Vianet's services with members of a household — a representation of the campaign's target audience. TVCs and creatives were developed in line with the idea of connection, and how untethered connectivity gave joy to the characters — reinforced with an upbeat jingle in the TVC concept.
  media:
    - type: caption
      text: >-
        The "Aba Sabai Connected" TVC.
