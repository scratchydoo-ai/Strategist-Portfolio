- id: rittman
  title: BRAND IDENTITY & WEB DEVELOPMENT
  client: Rittman Analytics
  nav_category: Rebrand Campaign
  tags: Digital
  sections:
    - label: Background
      text: >-
        Rittman Analytics had spent years building a strong reputation on the strength of its client work, but had never put that reputation into words — its own brand presence had stayed an afterthought behind a website, a podcast, and a long list of happy clients.
    - label: Challenge
      text: >-
        The identity had to come from qualitative signal, not the quantitative data Rittman worked in day to day — sharp enough to land with CTOs and data teams, without flattening the technical substance that made the firm credible.
    - label: Strategy
      text: >-
        The process started with an audit of Rittman's own digital footprint — down to the founder's SoundCloud sessions — a competitor deep-dive, branding workshops with the team, and interviews with clients and current and former employees. What surfaced was a single line, "building data excellence into the heart of businesses," carried into a new visual identity built on abstract, architectural shapes — reflecting how no two clients' data needs are the same.
