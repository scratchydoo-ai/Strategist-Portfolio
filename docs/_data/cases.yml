- id: stride
  title: New Product Development
  client: Stride — Men's Health
  nav_category: New Product Development
  tags: Brand Strategy · Packaging Design
  sections:
    - label: Background
      text: >-
        Prenetics, a genome based health science company, was looking to expand into men's health, a category built on taboo subjects like ED, premature ejaculation, and hair loss, and needed a brand that could hold its own in a crowded, stigma-heavy market.
    - label: Challenge
      text: >-
        Competitors already covered bold, sensitive, and educational tones, and with little room for product differentiation, the brand needed to sit in a league of its own.
    - label: Insight
      text: >-
        Confidence was the gap in the market. Instead of dwelling on the problem, the opportunity was to own the solution. The created brand would&nbsp;act as a guide that helped men move forward, unapologetically and with confidence.
    - label: Strategy
      text: >-
        We undertook a full market analysis and branding workshop with key Prenetics decision makers. Our analysis covered the competitors, their brand language, and pricing strategy. Our workshop birthed a brand to fill the gaps: Stride. Under the line "Confidence in every walk of life", Stride's identity paired fluid, sensual shapes with topographic elements to suggest navigation and personal journeys. A website and full product mock-ups brought the concept to life; the brand ultimately didn't launch after Prenetics made a strategic pivot.
  media:
