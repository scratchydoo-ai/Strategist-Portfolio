- id: fonepay
  title: NATIONWIDE ENROLLMENT CAMPAIGN
  title_style: "line-height: 1.01; letter-spacing: 0.03em"
  client: Fonepay Payments
  nav_category: Enrollment Campaign
  tags: Brand Strategy · TV · Print · Digital
  sections:
    - label: Background
      text: >-
        Before the pandemic, cashless payments were still new to Nepal, and users were wary of a market that felt confusing and hard to trust. F1Soft International, the network behind Nepal's interoperable mobile-banking gateway, needed to turn that wariness into everyday signups and usage.
    - label: Challenge
      text: >-
        Two ideas had to land in the same breath. The first: Fonepay is a feature inside a customer's own banking app, not a separate app to download. The second: it only works once it has been activated at their bank.
    - label: Insight
      text: >-
        Millennials were the household's default early adopters of new technology. Being seen as "in the know" on new tech mattered to them. What also mattered was getting special treatment because you knew a guy who knew a guy.&nbsp;
    - label: Strategy
      text: >-
        The campaign ran under one line — "Mobile Saathma, Bank Haathma" ("Your bank in your hands") — positioning digital payments as the obvious next step. It reached people through onsite bank promotions, campus and mall activations, a TV spot built on the social appeal of mobile banking. Once footfall recovered post-pandemic, we pivoted into a sweepstakes campaign, "QR Ma Upahaar" (Prizes with QR) that rewarded both users and merchants for making a QR payment through the Fonepay network.
  result: Drove a 121% increase in digital payments nationwide
