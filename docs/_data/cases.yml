- id: battle
  title: BRAND IDENTITY & LAUNCH
  client: Battle of the Bands Nepal
  nav_category: Show Launch
  tags: TV · Print · Digital
  sections:
    - label: Background
      text: >-
        Nepal has a thriving rock scene with amazing artists and bands appealing to every niche. Whether it's punk, heavy metal, classical or funk. While international talent-hunt formats like The Voice, Nepali Idol, and Dancing With The Stars were already on Nepali TV, there was no show showcasing the ever-budding talent of Nepali rock. Turnpike Entertainment wanted to start something epic: The Battle of the Bands.
    - label: Challenge
      text: >-
        Creating a marketing communications campaign and show identity from scratch to make the show the talk of the town, and to gain a large participation base for a show concept around a classic genre.&nbsp;
    - label: Insight
      text: >-
        Rock 'n' roll is in Nepal. Ever since the Summer of '69, generations have grown up listening to, singing along with, and playing the classics (and the not-so-classics). They formed cover bands, friendships, and even a few rivalries (Metallica vs. Aerosmith)!
    - label: Strategy
      text: >-
        To stay true and authentic to rock enthusiasts, the launch strategy built the image of Battle of the Bands as the go-to resource for rock 'n' roll. Through trivia, teasers, musical giveaways and sponsored contests, the show gave aspiring musicians a platform to showcase their talent. Captivating visuals and a consistent theme escalated communication alongside auditions and planned TV programming, keeping audiences engaged online, offline, on-air, and off-air, under the straightforward prompt: "Nepal's Biggest Band Competition."
