- id: weekender
  title: PRINT-BASED LAUNCH&nbsp;
  client: The Weekender
  nav_category: Launch Campaign
  tags: Print · Digital
  sections:
    - label: Background
      text: >-
        Following the refined revamp of The Kathmandu Post, the paper's editorial staff approached us looking for a strategy and campaign for the launch of their weekly lifestyle supplement that was "on-brand." Whilst the potential name for the paper was already in place, a way forward in communication was still needed — one that was distinguished from competing lifestyle weeklies.
    - label: Challenge
      text: >-
        Creating a communication approach that encompassed the multi-faceted interests of Kathmandu's robust cosmopolitan lifestyle.
    - label: Insight
      text: >-
        Kathmandu has a plethora of scenes and cultures — the weekend is when people can fully enjoy all that the thriving metropolis has to offer: international cuisines, a thriving art scene, an ever-trending fashion scene, living cultural heritage sites, breathtaking natural hikes. Regardless of the individual, the weekend always invites you to unwind and make life more vibrant. The upcoming supplement was seen as a menu to help feed these passions.
    - label: Strategy
      text: >-
        To show that The Weekender has content appealing to all the different hues of leisure people enjoy, and in line with the refined, upscale look and feel of The Kathmandu Post, the approach used bright and vibrant visuals to stand out both on social feeds and in print — conveying The Weekender's proposition of bringing more colour and life into the weekend. Character visuals were developed with the creative team around the multitude of identities and interests of the millennial target demographic, each categorised into the editorial team's thematic content pillars.
